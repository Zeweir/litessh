[package]
name = "litessh"
version = "0.1.0"
edition = "2021"
description = "LiteSSH — lightweight SSH client"
default-run = "litessh"

[lib]
name = "litessh_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
ssh-core = { path = "../crates/ssh-core" }
russh-sftp = "3.0.1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
dirs = "6"
uuid = { version = "1", features = ["v4"] }

[workspace]
# standalone package, outside the root workspace (root members = crates/*)
